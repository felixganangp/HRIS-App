<app-toast-container [toasts]="state.toasts()" (dismiss)="state.dismissToast($event)" />

@if (state.isAuthenticated()) {
  <div class="min-h-screen bg-slate-100 flex flex-col">
    <app-header />

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <router-outlet />
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
      HRIS App Portal • Angular Standalone with responsive Design • Created by:
      <a href="https://github.com/felixganangp">@felixganangp</a>
    </footer>
  </div>
} @else {
  <router-outlet />
}
