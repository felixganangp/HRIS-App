<div
  class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-900 via-indigo-950 to-slate-900 px-4 py-12"
>
  <div
    class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200/80 overflow-hidden"
  >
    <!-- Header Banner -->
    <div class="bg-indigo-600 px-8 py-7 text-white text-center relative overflow-hidden">
      <h1 class="text-2xl font-bold tracking-tight">HRIS App Portal</h1>
      <p class="text-indigo-100 text-sm mt-1">Employee Management System</p>
    </div>

    <!-- Login Form -->
    <div class="p-8">
      @if (authError()) {
        <div
          class="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 flex items-start gap-3 text-red-700 text-sm"
        >
          <svg
            class="w-5 h-5 text-red-500 shrink-0 mt-0.5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span>{{ authError() }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">
            Username
          </label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Input username"
            class="w-full px-4 py-2.5 bg-slate-50 border rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:bg-white transition-all"
            [class.border-red-400]="isFieldInvalid('username')"
            [class.border-slate-300]="!isFieldInvalid('username')"
          />
          @if (isFieldInvalid('username')) {
            <p class="mt-1.5 text-xs font-medium text-red-600">Username is required.</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">
            Password
          </label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Input password"
              class="w-full px-4 pr-11 py-2.5 bg-slate-50 border rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:bg-white transition-all"
              [class.border-red-400]="isFieldInvalid('password')"
              [class.border-slate-300]="!isFieldInvalid('password')"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
          @if (isFieldInvalid('password')) {
            <p class="mt-1.5 text-xs font-medium text-red-600">Password is required.</p>
          }
        </div>
        <button
          type="submit"
          class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition-all cursor-pointer"
        >
          Login
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <div
          class="bg-indigo-50/70 border border-indigo-100 rounded-xl p-3.5 text-xs text-slate-600"
        >
          <div class="font-semibold text-indigo-900 mb-2">Demo Account (Click to autofill):</div>
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              (click)="fillCredentials('admin', 'admin123')"
              class="text-left px-2.5 py-1.5 bg-white hover:bg-indigo-100/70 border border-indigo-200 rounded-lg cursor-pointer"
            >
              <div class="font-bold text-indigo-700">Admin</div>
              <div class="text-slate-500 font-mono">admin / admin123</div>
            </button>
            <button
              type="button"
              (click)="fillCredentials('user', 'user123')"
              class="text-left px-2.5 py-1.5 bg-white hover:bg-indigo-100/70 border border-indigo-200 rounded-lg cursor-pointer"
            >
              <div class="font-bold text-indigo-700">HR Staff</div>
              <div class="text-slate-500 font-mono">user / user123</div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
