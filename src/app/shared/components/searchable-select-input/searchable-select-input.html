<div class="relative">
  <button
    type="button"
    [disabled]="isDisabled()"
    (click)="toggleDropdown()"
    class="w-full px-3.5 py-2.5 text-sm text-left bg-slate-50 border rounded-xl flex items-center justify-between focus:outline-none focus:ring-2 transition-all disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer"
    [class.border-red-400]="hasError()"
    [class.focus:ring-red-200]="hasError()"
    [class.border-slate-300]="!hasError()"
    [class.focus:ring-indigo-500]="!hasError()"
  >
    <span [class.text-slate-400]="!value()" [class.text-slate-900]="value()">
      {{ value() || placeholder() }}
    </span>
    <svg
      class="w-4 h-4 text-slate-500 transition-transform shrink-0"
      [class.rotate-180]="isOpen()"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      class="absolute z-30 mt-1.5 w-full bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden"
    >
      <div class="p-2.5 bg-slate-50 border-b border-slate-200">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </span>
          <input
            type="text"
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
            (click)="$event.stopPropagation()"
            [placeholder]="searchPlaceholder()"
            class="w-full pl-8 pr-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
      </div>

      <!-- Options List -->
      <ul class="max-h-48 overflow-y-auto divide-y divide-slate-100 text-sm">
        @for (option of filteredOptions(); track option) {
          <li>
            <button
              type="button"
              (click)="selectOption(option)"
              class="w-full text-left px-3.5 py-2.5 hover:bg-indigo-50 transition-colors flex items-center justify-between cursor-pointer"
              [class.bg-indigo-50]="value() === option"
              [class.font-semibold]="value() === option"
              [class.text-indigo-700]="value() === option"
            >
              <span>{{ option }}</span>
              @if (value() === option) {
                <svg
                  class="w-4 h-4 text-indigo-600"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
              }
            </button>
          </li>
        } @empty {
          <li class="px-3.5 py-3 text-xs text-slate-400 text-center">
            {{ emptyText() }}
          </li>
        }
      </ul>
    </div>
  }
</div>
