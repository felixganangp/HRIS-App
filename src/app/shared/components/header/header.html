<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a routerLink="/employees" class="flex items-center gap-2.5">
      <div
        class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold shadow-xs"
      >
        HA
      </div>
      <div>
        <span class="font-bold text-slate-900 text-base block leading-none">HRIS App</span>
        <span class="text-[11px] text-slate-500 font-medium">Employee Management System</span>
      </div>
    </a>

    <div class="flex items-center gap-3 sm:gap-4">
      <div
        class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-100 rounded-full text-xs font-semibold text-slate-700"
      >
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>{{ state.currentUser() | uppercase }}</span>
      </div>

      <button
        type="button"
        (click)="onLogout()"
        class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-xl transition-colors cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</header>
