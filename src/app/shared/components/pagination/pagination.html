@if (mode() === 'top') {
  <!-- Top Info & Page Size Selector -->
  <div
    class="px-5 py-3.5 bg-slate-50/70 border-b border-slate-200/80 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-slate-600"
  >
    <div>
      Showing <span class="font-bold text-slate-900">{{ displayStart() }}</span> -
      <span class="font-bold text-slate-900">{{ displayEnd() }}</span> from
      <span class="font-bold text-indigo-600">{{ totalItems() }}</span> {{ itemLabel() }}
    </div>

    <div class="flex items-center gap-2">
      <label [for]="selectId" class="text-xs font-medium text-slate-600">Show:</label>
      <select
        [id]="selectId"
        [value]="pageSize()"
        (change)="onPageSizeSelect($event)"
        class="px-2.5 py-1.5 text-xs font-semibold bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
      >
        @for (size of pageSizeOptions(); track size) {
          <option [value]="size">{{ size }} rows</option>
        }
      </select>
    </div>
  </div>
} @else {
  <!-- Bottom Page Navigation -->
  <div
    class="px-5 py-4 bg-slate-50/70 border-t border-slate-200/80 flex flex-col sm:flex-row items-center justify-between gap-4"
  >
    <div class="text-xs text-slate-500">
      Page <span class="font-bold text-slate-800">{{ safeCurrentPage() }}</span> from
      <span class="font-bold text-slate-800">{{ totalPages() }}</span>
    </div>

    <div class="flex items-center gap-1.5 flex-wrap justify-center">
      <button
        type="button"
        [disabled]="safeCurrentPage() <= 1"
        (click)="emitPage(1)"
        class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer"
      >
        First
      </button>
      <button
        type="button"
        [disabled]="safeCurrentPage() <= 1"
        (click)="emitPage(safeCurrentPage() - 1)"
        class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer"
      >
        Prev
      </button>

      @for (page of visiblePages(); track page) {
        <button
          type="button"
          (click)="emitPage(page)"
          class="w-8 h-8 text-xs font-bold rounded-lg transition-colors cursor-pointer"
          [class.bg-indigo-600]="page === safeCurrentPage()"
          [class.text-white]="page === safeCurrentPage()"
          [class.bg-white]="page !== safeCurrentPage()"
          [class.text-slate-700]="page !== safeCurrentPage()"
          [class.border]="page !== safeCurrentPage()"
          [class.border-slate-300]="page !== safeCurrentPage()"
          [class.hover:bg-slate-100]="page !== safeCurrentPage()"
        >
          {{ page }}
        </button>
      }

      <button
        type="button"
        [disabled]="safeCurrentPage() >= totalPages()"
        (click)="emitPage(safeCurrentPage() + 1)"
        class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer"
      >
        Next
      </button>
      <button
        type="button"
        [disabled]="safeCurrentPage() >= totalPages()"
        (click)="emitPage(totalPages())"
        class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer"
      >
        Last
      </button>
    </div>
  </div>
}
